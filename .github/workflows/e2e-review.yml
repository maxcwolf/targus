name: e2e-review

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium
      - name: Build the review UI
        run: yarn workspace @targus/web build
      # Playwright's webServer rebuilds the web app and starts `wrangler dev` serving it.
      - run: yarn e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
