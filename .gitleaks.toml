# gitleaks runs in .github/workflows/check.yml. Default rules stay on; this file only
# allowlists material that looks like a secret but is not one. Keep it narrow: name files,
# not directories, and prefer a regex for a known placeholder over a path.
title = "targus gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and documentation placeholders, not real secrets"
paths = [
  # Placeholder PEM strings used to exercise config parsing.
  '''apps/api/src/config\.test\.ts''',
  '''apps/api/src/composition\.test\.ts''',
  # A throwaway PKCS#8 key generated for the GitHub client tests.
  '''apps/api/test/support/github-stub\.ts''',
]
regexes = [
  # Admin tokens used only by local `wrangler dev` examples and the Playwright e2e.
  '''(dev|e2e)-admin-token''',
]
